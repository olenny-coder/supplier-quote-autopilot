[project]
name = "supplier-quote-autopilot"
version = "1.0.0"
description = "Supplier Quote Autopilot — RFQ collection, automated follow-up, and landed-cost comparison"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41",
    # psycopg 3 is the sync driver inherited from the base codebase; it speaks to
    # Neon's pooled endpoint natively. See INTEGRATION_PLAN.md assumption A1.
    "psycopg[binary]>=3.2.9",
    "alembic>=1.13.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.20",
    "PyJWT>=2.9.0",
    # HTTP client for the LLM provider and the HTTP email APIs. No SMTP anywhere.
    "httpx>=0.28.1",
    # S3-compatible object storage (Cloudflare R2 / Backblaze B2 / Neon Object
    # Storage) for production uploads. Imported lazily, so the local backend and
    # the test suite do not need it.
    "boto3>=1.35.0",
    # Retained for the pre-existing chat agents (rfq_assistant, orchestrator,
    # supplier_mailer, PDF quote extraction). The new autopilot features do not
    # use LangChain — they use app/core/llm_client.py.
    "langchain>=1.3.9",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.5",
    "openai>=1.93.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]
