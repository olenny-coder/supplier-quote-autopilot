[alembic]
script_location = alembic

# The URL is NOT set here. `alembic/env.py` reads the application settings so
# migrations always target the same database the app does, and it uses
# DATABASE_URL_DIRECT (the non-pooled Neon string) rather than DATABASE_URL.
# Leaving a URL in this file would create a second, silently divergent source of
# truth — and `%` characters in a database password would break configparser
# interpolation here anyway.
sqlalchemy.url =

prepend_sys_path = .

# Timestamped revision filenames sort chronologically in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
