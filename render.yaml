# =============================================================================
# Render Blueprint — Supplier Quote Autopilot
# =============================================================================
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# Provisions all three services: the API, and the two single-page apps as static
# sites. The database is Neon rather than Render Postgres, because Render's free
# Postgres expires after 30 days and would silently take the app down.
#
# WHY THE FRONTENDS ARE HERE AND NOT ON VERCEL
#   Render static sites are free and, unlike web services, do NOT draw on the 750
#   instance hours — so two of them cost nothing and cannot starve the API. They
#   also carry no commercial-use restriction, which Vercel's Hobby plan does; this
#   product is a procurement tool, so that restriction is disqualifying rather than
#   theoretical.
#
# Free-tier facts this file is built around:
#   * 512 MB RAM / 0.1 CPU          -> keep the process light; no worker process
#   * spins down after 15 min idle  -> /health + an external cron (see README)
#   * 750 instance hours/month      -> ONE web service; static sites are separate
#   * no persistent disk            -> STORAGE_BACKEND=s3 if you want uploads
#   * SMTP ports 25/465/587 BLOCKED -> EMAIL_PROVIDER is an HTTPS API
#
# WHY THERE IS NO worker/ OR cron: SERVICE HERE
#   A Render Cron Job or Background Worker is a second billable instance and would
#   break the 750 free hours. The follow-up scheduler therefore runs (a) as a
#   background task inside the web service and (b) behind
#   POST /internal/scheduler/tick, which any free external cron can drive.
# =============================================================================

services:
  - type: web
    name: supplier-quote-autopilot-api
    runtime: python

    # The repository keeps `agents/` and `comparison/` as siblings of `backend/`,
    # and `app/__init__.py` resolves them from the repository root. Render clones
    # the whole repo, so rootDir only changes the working directory — the sibling
    # packages stay reachable.
    rootDir: backend

    plan: free
    region: oregon
    branch: main

    # `requirements.txt` is generated from `uv.lock` by
    #   uv export --format requirements-txt --no-dev --no-hashes --no-emit-project
    # and CI fails if the two drift. Rendering it out means the start command can
    # be the plain `uvicorn ...` form with no venv indirection.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Exactly the documented start command. `$PORT` is injected by Render.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # /health always answers 200 (dependency trouble is reported in the body as
    # "degraded") so UptimeRobot's ping counts as up and keeps the service warm.
    healthCheckPath: /health

    # `autoDeploy`, not `autoDeployTrigger`: the short form has been in the
    # blueprint schema far longer, and an unrecognised key fails blueprint
    # validation outright rather than being ignored.
    autoDeploy: true

    envVars:
      # ---------------------------------------------------------------- runtime
      - key: ENV
        value: production

      # NOTE: PYTHON_VERSION is deliberately NOT set here. `backend/.python-version`
      # already pins the version, and Render's native Python runtime reads that file.
      # Declaring a second, different value (it used to say 3.13.7 while the file
      # said 3.13) makes the effective version ambiguous, and if Render cannot
      # resolve the exact patch it pins, the build fails before anything runs.
      # One source of truth wins. If a build ever complains about the Python
      # version, delete backend/.python-version and Render will use its default.

      # --------------------------------------------------------------- database
      # Set in the dashboard; Render must not store these in the repo.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false

      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"

      # ------------------------------------------------------------------- auth
      # `generateValue: true` makes Render mint a strong secret on first deploy.
      # Read it back from the dashboard if you need it elsewhere.
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"

      # ------------------------------------------------------------------- URLs
      # Fill in after the first Vercel deploy, then redeploy.
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_FORM_URL
        sync: false

      # CORS. Comma-separated exact origins, scheme included, no trailing slash.
      #
      # This ships a wildcard rather than `sync: false` on purpose, because a blank
      # box here is the worst of the three states. `sync: false` with no value gave
      # the variable the empty string, which parses to an empty origin list — and an
      # empty list rejects *every* browser origin with "400 Disallowed CORS origin".
      # The API is up, /health is green, and the dashboard cannot make a single
      # request: a total failure that looks like a frontend bug.
      #
      # `*` works immediately and the application logs a warning when a production
      # deployment uses it, which is the nudge to replace it. So: deploy, confirm it
      # works, then set the two origins below.
      #   ALLOWED_ORIGINS=https://your-dashboard.vercel.app,https://your-supplier-form.vercel.app
      - key: ALLOWED_ORIGINS
        value: "*"

      # -------------------------------------------------------------------- LLM
      # Groq by default. Swap all three for OpenRouter or Gemini — see the README.
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false

      # Free-tier guardrails: Groq allows ~30 req/min and 14,400 req/day per model.
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_REQUESTS_PER_MINUTE
        value: "30"
      - key: LLM_MAX_CONCURRENCY
        value: "2"
      - key: LLM_MAX_RETRIES
        value: "4"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      # The default model reasons before it answers. "low" keeps that trace short
      # enough for the JSON answer to fit the token budget; at the provider default
      # Groq rejected every JSON call with HTTP 400 and all three LLM features fell
      # back to their deterministic paths.
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_BATCH_MAX_CALLS
        value: "50"

      # ------------------------------------------------------------------ email
      # HTTPS only. smtp is not merely unused here, it does not exist in the code.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # ---------------------------------------------------------------- storage
      # Render free tier has no persistent disk, so `local` would lose every
      # upload on the next deploy.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # `path` for every S3-compatible provider — Neon Object Storage documents
      # path-style as required, and R2, MinIO and B2 all support it. `auto` is
      # botocore's default (virtual-hosted when the bucket name is DNS-compatible)
      # and is only right for real AWS S3. Getting this wrong fails against
      # `<bucket>.<endpoint>`, a hostname nobody configured, so it reads as an
      # outage rather than a setting.
      - key: S3_ADDRESSING_STYLE
        value: path
      - key: MAX_UPLOAD_MB
        value: "10"

      # ------------------------------------------------------------- public form
      - key: INVITATION_TTL_DAYS
        value: "30"
      - key: PUBLIC_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: PUBLIC_RATE_LIMIT_PER_HOUR
        value: "60"
      - key: CAPTCHA_PROVIDER
        value: none
      - key: CAPTCHA_SITE_KEY
        sync: false
      - key: CAPTCHA_SECRET_KEY
        sync: false

      # -------------------------------------------------------------------- demo
      # GET /demo/workspace — a sample tender anyone can read with no account.
      # The payload is the committed snapshot at
      # app/features/demo/workspace.json, regenerated with
      #   python -m scripts.seed_demo --dump-demo
      # It is a file rather than a query, so an anonymous visitor can never read
      # real suppliers or prices, and nothing under /demo accepts a write.
      # Set false to ship without a demo.
      - key: DEMO_MODE_ENABLED
        value: "true"

      # -------------------------------------------------------------- follow-ups
      # `false` = every reminder is queued as a draft for the buyer to approve.
      # Flip to `true` to auto-send reminders. Awarding ALWAYS needs a human.
      - key: AUTO_SEND_FOLLOWUPS
        value: "false"
      - key: FOLLOWUP_INTERVALS_HOURS
        value: "72,168"
      - key: FOLLOWUP_BEFORE_DEADLINE_HOURS
        value: "48"
      - key: MAX_FOLLOWUPS_PER_INVITATION
        value: "3"
      - key: MAX_INCOMPLETE_REMINDERS
        value: "2"

      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "15"
      # Required to enable POST /internal/scheduler/tick; the endpoint 403s while
      # this is empty. Render mints one so the cron path works out of the box —
      # copy the value into your cron's header.
      - key: SCHEDULER_SECRET
        generateValue: true

      # -------------------------------------------------------- procurement type
      # What a new RFQ is unless the buyer picks otherwise. `service` is building
      # maintenance and minor works (electrical, mechanical, plumbing, painting,
      # ACMV…): the service field contract, the service weights, and the services
      # vocabulary. Set to `goods` for a supplies-only workspace.
      - key: DEFAULT_PROCUREMENT_TYPE
        value: service

      # -------------------------------------------------------------- comparison
      # Every price is normalized into this currency before anything is compared.
      - key: BASE_CURRENCY
        value: SGD
      # GST applied when a supplier states a rate but no explicit tax amount.
      # 9.0 is the current Singapore rate; set 0 if you are not GST-registered.
      - key: DEFAULT_GST_RATE
        value: "9.0"
      - key: LEAD_TIME_RISK_DAYS
        value: "90"
      - key: QUOTE_VALIDITY_WARNING_DAYS
        value: "7"
      - key: FX_RATES_JSON
        sync: false
      - key: DEFAULT_SCORING_WEIGHTS_JSON
        sync: false

  # ===========================================================================
  #  Buyer dashboard — static site
  # ===========================================================================
  # `runtime: static` rather than a web service: Render builds the bundle and
  # serves it from its CDN. There is no `startCommand` and no `plan` because there
  # is no long-running instance — which is exactly why this costs nothing and does
  # not touch the 750 instance hours the API depends on.
  - type: web
    name: supplier-quote-dashboard
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true

    envVars:
      # ⚠️ Build-time, not runtime. Vite inlines `import.meta.env.*` while the
      # bundle is built, so changing this requires a **deploy**, not just an env
      # edit. Point it at the API service above.
      - key: VITE_API_URL
        sync: false

    # Client-side routing: every path that is not a real file falls back to the SPA,
    # so a refresh on /rfqs/12 or a pasted deep link does not 404. This replaces the
    # rewrite that `frontend/vercel.json` performed.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite fingerprints the filenames, so a hashed asset can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The HTML entry point must not be, or a deploy would keep serving the old
      # bundle to anyone with it cached.
      - path: /index.html
        name: Cache-Control
        value: no-cache

  # ===========================================================================
  #  Supplier quote form — static site
  # ===========================================================================
  # A separate service on purpose: suppliers reach a different origin from buyers,
  # so a link pasted into an email cannot be confused with the buyer's app and the
  # two can be deployed independently.
  - type: web
    name: supplier-quote-form
    runtime: static
    branch: main
    rootDir: public_form
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      # The supplier link is /quote/<rfq_id>/<token>; without this, opening one
      # directly would 404 on the static host and every invitation would be dead.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache

