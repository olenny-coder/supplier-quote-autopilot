<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Icons. All three are generated by scripts/make_favicons.py from one drawing, so
      the tab, the bookmark bar, a Windows shortcut and an iOS home screen cannot show
      three different marks.

      The .ico comes first for browsers that do not read SVG icons: it carries 16, 32
      and 48 px, so nothing is ever scaled from the wrong size. The SVG is the one
      every current browser actually uses, and it stays sharp on a high-density screen.
      apple-touch-icon.png is 180 px with an opaque background, because iOS masks the
      icon itself and a transparent tile would come out ringed in black.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f4f6fb" />

    <meta
      name="description"
      content="Supplier Quote Autopilot — create RFQs, invite suppliers, chase the gaps, compare quotes and approve the award."
    />

    <title>Supplier Quote Autopilot</title>

    <!--
      Apply the persisted theme before first paint to avoid a flash of the
      wrong color scheme. Mirrors the logic in src/shared/theme/ThemeProvider.jsx.

      The theme-color meta is set here rather than declared twice with a
      `prefers-color-scheme` media query, because the buyer can override the
      system setting: a media query would colour the phone's toolbar for the
      device's preference while the app itself was showing the other scheme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", isDark);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", isDark ? "#080a12" : "#f4f6fb");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
