name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per branch. A superseded push should not race the newer one for the
  # deploy step.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never reach a real database, LLM, or email provider. Setting these
  # here rather than only in conftest means a test that bypasses the fixtures still
  # cannot make a network call that costs money or sends mail.
  LLM_API_KEY: ""
  LLM_ENABLED: "false"
  EMAIL_PROVIDER: console
  EMAIL_API_KEY: ""
  STORAGE_BACKEND: local
  SCHEDULER_ENABLED: "false"
  AUTO_SEND_FOLLOWUPS: "false"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (correctness rules)
        # F and E9 only — see [tool.ruff.lint] in pyproject.toml. This is what caught
        # an unused-import sweep plus a test file written in the wrong encoding.
        run: uv run ruff check . ../agents ../comparison

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci-test.db
        run: uv run pytest -q

      - name: Check the migration matches the models
        # `alembic check` fails when the models define something the migration does
        # not contain. It is the cheapest guard against a deploy that boots against
        # a schema the code does not expect.
        env:
          DATABASE_URL: sqlite:///./ci-alembic.db
          DATABASE_URL_DIRECT: ""
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Verify requirements.txt is in sync with uv.lock
        # Render installs from requirements.txt (so the start command can be the
        # plain `uvicorn ...` form). If the two drift, production silently runs a
        # different dependency set than CI tested.
        #
        # Only the dependency lines are compared. `uv export` writes a header comment
        # recording the `-o` path it was given, which differs between a temp file and
        # the committed one and would otherwise fail the check for no reason.
        run: |
          uv export --format requirements-txt --no-dev --no-hashes --no-emit-project -o /tmp/requirements.expected

          grep -v '^#' /tmp/requirements.expected | grep -v '^[[:space:]]*$' > /tmp/expected.deps
          grep -v '^#' requirements.txt       | grep -v '^[[:space:]]*$' > /tmp/actual.deps

          if ! diff -q /tmp/expected.deps /tmp/actual.deps > /dev/null; then
            echo "::error::requirements.txt is out of date. Regenerate it with:"
            echo "  uv export --format requirements-txt --no-dev --no-hashes --no-emit-project -o requirements.txt"
            diff -u /tmp/actual.deps /tmp/expected.deps || true
            exit 1
          fi

          echo "requirements.txt matches uv.lock ($(grep -c '==' requirements.txt) pinned dependencies)"

      - name: Assert there is no SMTP dependency
        # Render's free tier blocks ports 25/465/587, so an SMTP code path is a
        # production outage waiting to happen. The test suite covers this too; this
        # step makes the rule fail the build even if that test is ever removed.
        run: |
          if grep -rnE "^\s*(import smtplib|from smtplib)" --include="*.py" . ../agents ../comparison; then
            echo "::error::SMTP is not permitted — use the HTTP email API (app/core/email.py)."
            exit 1
          fi
          echo "no SMTP imports found"

  frontend:
    name: Buyer dashboard build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  public_form:
    name: Supplier form build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: public_form

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: public_form/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  compose:
    name: Compose config is valid
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        # `docker compose up` is an acceptance criterion, and a malformed compose
        # file is the kind of breakage that only shows up on a fresh clone.
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid"

      - name: Validate render.yaml
        # Needs PyYAML. Install it rather than assuming the runner image has it —
        # the fallback below skips the check silently, which would mean the
        # validation never actually ran.
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              print("::warning::pyyaml unavailable; render.yaml was NOT validated")
              sys.exit(0)
          with open("render.yaml") as handle:
              data = yaml.safe_load(handle)
          services = data.get("services") or []
          assert services, "render.yaml defines no services"
          for service in services:
              assert service["type"] == "web", "only web services fit the free tier"
              assert service.get("plan") == "free", "free plan expected"
              assert service.get("startCommand"), "startCommand is required"
          print("render.yaml is valid")
          PY

      - name: Validate the Vercel configs are valid JSON with SPA rewrites
        # A malformed vercel.json or a missing rewrite is the difference between a
        # working deep link and a 404 on refresh, and neither shows up in a local
        # build.
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          for path in ("frontend/vercel.json", "public_form/vercel.json"):
              data = json.loads(pathlib.Path(path).read_text())
              rewrites = data.get("rewrites") or []
              assert rewrites, f"{path} has no rewrites; deep links will 404"
              destinations = {r.get("destination") for r in rewrites}
              assert "/index.html" in destinations, f"{path} does not rewrite to /index.html"
              print(f"{path}: ok ({len(rewrites)} rewrite rule)")
          PY

  deploy:
    name: Trigger deploys
    runs-on: ubuntu-latest

    needs: [backend, frontend, public_form, compose]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # The deploy hooks are optional: Render and Vercel both deploy from the GitHub
    # integration, so a repo without them still deploys. They are mapped to env here
    # rather than referenced directly in the step `if`, because the `secrets`
    # context is not reliably available in a step-level condition — GitHub rejects
    # the workflow rather than skipping the step.
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Trigger Vercel deploys
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Summary
        run: |
          {
            echo "### Deploy triggered"
            echo ""
            echo "- Backend: Render (blueprint: render.yaml)"
            echo "- Buyer dashboard: Vercel (root: frontend/)"
            echo "- Supplier form: Vercel (root: public_form/)"
            echo ""
            echo "Remember to run migrations against the DIRECT connection string:"
            echo '  DATABASE_URL_DIRECT=... alembic upgrade head'
          } >> "$GITHUB_STEP_SUMMARY"
