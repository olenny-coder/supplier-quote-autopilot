<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      No maximum-scale / user-scalable=no: suppliers must always be able to
      pinch-zoom to read specification text on a phone.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#f4f6fb" />

    <meta
      name="description"
      content="Submit your price quote to the buyer. Secure, no account needed."
    />

    <meta name="robots" content="noindex, nofollow" />

    <title>Submit your quote</title>

    <!--
      Icons. The same three files as the buyer dashboard, from the same drawing
      (scripts/make_favicons.py): a supplier who has both open sees one product, not
      two. The .ico carries 16, 32 and 48 px for browsers that do not read SVG, and
      the SVG is what every current browser uses.

      This replaces an inline `data:image/svg+xml` icon. The data URI worked, but it
      was a second copy of the mark that no other app could share and that nothing
      could regenerate — and there was no apple-touch-icon at all, so a supplier who
      saved the form to their home screen got a screenshot of the page.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Apply the persisted theme before first paint to avoid a flash of the wrong
      colour scheme — a supplier opening this link on a dark phone must not get a
      white rectangle first. Mirrors the logic in src/theme/ThemeProvider.jsx;
      the two must stay in step. Same approach as the buyer app's index.html.

      The theme-color meta is updated here too, so the phone's status bar follows
      the page instead of staying light above a dark form.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", isDark);

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", isDark ? "#080a12" : "#f4f6fb");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
