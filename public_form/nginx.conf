server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # The quote link path (/quote/1/<token>) is a client-side route, so any
    # unknown path must fall back to index.html and let react-router render it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No API proxy: the backend is a separate origin, addressed directly by the
    # browser through VITE_API_URL. Proxying here would hide CORS problems in
    # staging and then break in production.

    # Hashed build assets are immutable.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The HTML shell must never be cached, or suppliers keep seeing a stale form.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Static-host hardening. Cheap, and this page is served to people who are
    # about to type a price into it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
