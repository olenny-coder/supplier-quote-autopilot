# =============================================================================
# Local development stack.
#
#   cp .env.example .env        # then set SECRET_KEY (and optionally an LLM key)
#   docker compose up --build
#
#   Buyer dashboard   http://localhost:5173
#   Supplier form     http://localhost:5174/quote/<rfq_id>/<token>
#   API + Swagger     http://localhost:8000/docs
#   MinIO console     http://localhost:9001   (optional S3 backend, `--profile s3`)
#
# The `migrate` service runs Alembic once and exits; `backend` waits for it, so a
# fresh clone comes up with a correct schema rather than relying on the app's
# startup `create_all`.
# =============================================================================

name: supplier-quote-autopilot

services:
  postgres:
    image: postgres:17
    container_name: sqa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-supplier_quote_db}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supplier_quote_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Optional S3-compatible object storage, so the production upload path can be
  # exercised locally instead of only the filesystem one.
  #
  #   docker compose --profile s3 up
  #
  # then set STORAGE_BACKEND=s3, S3_ENDPOINT_URL=http://minio:9000,
  # S3_BUCKET=quotes, S3_ACCESS_KEY_ID=minioadmin, S3_SECRET_ACCESS_KEY=minioadmin
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sqa-minio
    profiles: ["s3"]
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bucket on first boot; exits immediately afterwards.
  minio-init:
    image: minio/mc:latest
    container_name: sqa-minio-init
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-quotes} &&
      mc anonymous set download local/${S3_BUCKET:-quotes} &&
      echo 'minio bucket ready'
      "

  # ---------------------------------------------------------------------------
  # One-shot migration runner. Uses the DIRECT connection string, because
  # PgBouncer's transaction pooling is not safe for DDL.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sqa-migrate

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/supplier_quote_db}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}

    depends_on:
      postgres:
        condition: service_healthy

    command: ["uv", "run", "alembic", "upgrade", "head"]

    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sqa-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/supplier_quote_db}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PUBLIC_FORM_URL: ${PUBLIC_FORM_URL:-http://localhost:5174}
      # Uploads land in a named volume so they survive `docker compose restart`.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_DIR: /app/var/uploads

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      # Dev convenience: edit backend code without rebuilding the image.
      # Alembic, agents/ and comparison/ are baked in, so a change there needs a
      # rebuild — they are not bind-mounted on purpose (the container layout puts
      # them at /app/agents and /app/comparison, which do not exist in the repo).
      - ./backend/app:/app/backend/app
      - uploads:/app/var/uploads

    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

    container_name: sqa-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-5173}:80"

    depends_on:
      - backend

  # The supplier-facing form. Served on its own port because that is how it is
  # deployed — a separate Vercel project with its own origin.
  public_form:
    build:
      context: ./public_form
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

    container_name: sqa-public-form
    restart: unless-stopped

    ports:
      - "${PUBLIC_FORM_PORT:-5174}:80"

    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  uploads:
